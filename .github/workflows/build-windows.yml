name: Build Windows (Electron)

on:
  workflow_dispatch:
  push:
    paths:
      - 'potalk-mac/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: potalk-mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: potalk-mac/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Potalker-windows
          path: |
            potalk-mac/dist/*.exe
            potalk-mac/dist/*.zip
          if-no-files-found: error
