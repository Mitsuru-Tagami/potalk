<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>部屋一覧</title><style>
html,body{height:100%;margin:0}
body{position:relative;background:var(--panel,#0a1120);color:var(--sub,#8fa0c4);font:11px -apple-system,"Hiragana Sans","Noto Sans JP",sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;border-right:1px solid var(--border,rgba(255,255,255,.14));border-radius:0 10px 10px 0;user-select:none}
body:hover{color:var(--text,#e8eefc)}
#t{writing-mode:vertical-rl;letter-spacing:.25em}
#chev{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:10px}
</style></head><body title="部屋の一覧を開く／閉じる">
<span id="t">部屋一覧</span><span id="chev">›</span>
<script>
document.body.onclick=()=>peekPm.toggle();
peekPm.onState(s=>{document.getElementById('chev').textContent=s.open?'‹':'›'});
const PROPS=['panel','text','sub','border'];
peekPm.onTheme(t=>{const r=document.documentElement;for(const k of PROPS){if(t&&t[k])r.style.setProperty('--'+k,t[k])}});
</script></body></html>
